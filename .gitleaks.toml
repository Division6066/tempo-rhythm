title = "tempo-rhythm"

[extend]
useDefault = true

# curl-auth-user treats `curl -u "$ENV_VAR:"` as a basic-auth secret.
# The dispatch router passes the Cursor API key that way: the username is a
# GitHub Actions secret reference and the password is empty. No literal
# credential is in the file. Other curl -u values stay flagged.
[[rules]]
id = "curl-auth-user"

[[rules.allowlists]]
description = "Username is a shell variable and the password is empty."
regexTarget = "secret"
regexes = ['''^"\$[A-Z_][A-Z0-9_]*:"$''']
