name: Orca control-plane dry run

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the control-plane manifest without dispatching work
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate control-plane shape and safety
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('docs/orca/control-plane.schema.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('docs/orca/control-plane.config.json', 'utf8'));
          const fail = (message) => { console.error(`CONTROL_PLANE_INVALID: ${message}`); process.exit(1); };
          if (schema.$schema !== 'https://json-schema.org/draft/2020-12/schema') fail('unexpected schema dialect');
          if (config.version !== '1') fail('unsupported manifest version');
          if (config.ticket.system !== 'github-issue') fail('ticket system is not GitHub Issues');
          if (config.ticket.projectView !== 'github-project-ordered-view') fail('queue assumption is not GitHub Project ordered view');
          if (config.run.mode !== 'dry-run' || config.run.dispatch !== 'none') fail('dry-run manifest can dispatch work');
          if (config.run.resultBinding !== 'commit-sha') fail('run is not commit-SHA-bound');
          if (!/^[0-9a-f]{40}$/.test(config.run.commitSha)) fail('invalid commit SHA');
          if (config.gates.map((gate) => gate.sequence).join(',') !== '1,2,3,4,5') fail('gate sequence is not sequential');
          if (config.gates.some((gate) => gate.resultBinding !== 'commit-sha')) fail('gate is not commit-SHA-bound');
          if (config.providerAccount.billingClass !== 'fixed-subscription' || config.providerAccount.overagePolicy !== 'fail-closed') fail('provider is not fixed-cost fail-closed');
          if (JSON.stringify(config).toLowerCase().includes('linear')) fail('Linear reference found');
          console.log('CONTROL_PLANE_DRY_RUN_OK');
          NODE
