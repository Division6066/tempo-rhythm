name: Orca control-plane dry run

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the control-plane manifest without dispatching work
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout manifests
        # actions/checkout v4.2.2, official commit pin.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate control-plane shape and safety
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('docs/orca/control-plane.schema.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('docs/orca/control-plane.config.json', 'utf8'));
          const fail = (message) => { console.error(`CONTROL_PLANE_INVALID: ${message}`); process.exit(1); };
          const ticketIds = new Set(config.tickets.map((ticket) => ticket.id));
          const roleIds = new Set(config.roles.map((role) => role.id));
          const providerKeys = new Set(config.providerAccounts.map((account) => `${account.providerId}/${account.accountAlias}`));
          if (schema.$schema !== 'https://json-schema.org/draft/2020-12/schema') fail('unexpected schema dialect');
          if (config.version !== '1') fail('unsupported manifest version');
          if (config.tickets.some((ticket) => ticket.system !== 'github-issue' || ticket.projectView !== 'github-project-ordered-view')) fail('ticket system or queue assumption is not GitHub');
          if (config.tickets.some((ticket) => !ticket.runId || !ticket.roleId || !roleIds.has(ticket.roleId) || !ticket.providerSelection?.providerId || !ticket.providerSelection?.accountAlias || !ticket.stage || !ticket.baseCommit || typeof ticket.approvalRequired !== 'boolean')) fail('ticket identity, role, or routing fields are incomplete');
          if (config.tickets.some((ticket) => ticket.providerSelection.providerId !== 'human' && !providerKeys.has(`${ticket.providerSelection.providerId}/${ticket.providerSelection.accountAlias}`))) fail('non-human provider/account reference is missing');
          if (config.tickets.some((ticket) => ticket.dependsOn.some((dependency) => !ticketIds.has(dependency)))) fail('ticket dependency reference is missing');
          const rolePrefixes = { orchestrator: '🧭 ', builder: '🛠 ', integrator: '🔀 ', ci: '⚙️ ', security: '🛡 ', 'ux-ui': '🎨 ', 'preview-deployer': '🚀 ', 'human-gate': '✋ ' };
          if (config.roles.length < 8 || Object.entries(rolePrefixes).some(([kind, prefix]) => !config.roles.some((role) => role.kind === kind && role.titlePrefix === prefix)) || new Set(config.roles.map((role) => role.titlePrefix)).size !== 8) fail('role records or role-specific prefixes are incomplete');
          if (config.providerAccounts.some((account) => !account.providerId || !account.accountAlias || !account.authRef || account.authRef.includes('=') || (account.billingPolicy === 'manual-approval-before-metered' && account.routingState === 'enabled'))) fail('provider account or billing safety invalid');
          if (config.runs.some((run) => run.mode !== 'dry-run' || run.maxParallelBuilders < 0 || run.activeBuilders.length > run.maxParallelBuilders || run.resultBinding !== 'commit-sha' || run.repairPolicy !== 'code-change-invalidates-later-results-restart-ci' || run.integrationTicket === undefined || !ticketIds.has(run.integrationTicket) || run.orderedTickets.some((ticketId) => !ticketIds.has(ticketId)))) fail('run model or ticket reference is invalid');
          if (config.gates.map((gate) => gate.id).join(',') !== 'integration,ci,security,ux,preview,human-gate') fail('gate sequence is not integration/CI/security/UX/preview/human');
          if (config.gates.slice(0, 5).some((gate) => gate.kind !== 'automated' || gate.production !== false || gate.resultBinding !== 'commit-sha')) fail('automated gate safety invalid');
          if (config.gates[5].kind !== 'human' || config.gates[5].production !== false) fail('human gate safety invalid');
          if (config.tickets.some((ticket) => (ticket.stage === 'human-gate') !== ticket.approvalRequired)) fail('human-gate approval relationship invalid');
          if (config.tickets.some((ticket) => ticket.stage === 'human-gate' && (ticket.providerSelection.providerId !== 'human' || ticket.providerSelection.accountAlias !== 'human-amit'))) fail('human gate is not manual-human');
          if (config.providerAccounts.some((account) => account.provider === 'human' && (account.authMode !== 'manual-human' || account.authRef !== null || account.billingPolicy !== 'blocked'))) fail('human provider has credential or billing semantics');
          if (JSON.stringify(config).toLowerCase().includes('linear')) fail('Linear reference found');
          if (JSON.stringify(config).toLowerCase().includes('auto-' + 'merge')) fail('automatic merge reference found');
          console.log('CONTROL_PLANE_DRY_RUN_OK');
          NODE
