name: Auto-arm merge
# Auto-merge stays off (AGENTS.md). This workflow used to run
# `gh pr merge --auto --squash` for every non-draft PR into integration,
# with contents: write and no collaborator check. It no longer arms merge.
# The job remains so the check name stays, and the token cannot merge.
on:
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
jobs:
  arm:
    if: github.event.pull_request.base.ref == 'integration' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Leave auto-merge off
        run: echo "Auto-merge stays off (AGENTS.md). This workflow does not arm merge."
