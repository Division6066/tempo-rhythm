name: factory-lane-cursor

# Phase 04 Step 5c. Cursor lane. vars.FACTORY_CURSOR_MODE:
#   automation (default): the Factory App re-adds label run:cursor on the ticket issue; the Cursor
#     Automation "Factory build - tempo-rhythm" (GitHub trigger "Issue label changed", run:cursor,
#     base integration, model vars.FACTORY_MODEL_CURSOR, PR creation ON) builds it. Created by hand,
#     left DISABLED until Phase 07 (BROWSER-TODO B8).
#   api (fallback B): POST https://api.cursor.com/v1/agents with secret CURSOR_API_KEY.
# Script: scripts/factory/cursor-lane.mjs. PARKED until the Factory App exists (both modes write
# labels/branches with its token; never GITHUB_TOKEN for PR work, R15) and, for api, CURSOR_API_KEY.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Ticket issue number
        required: true
        type: string
      fix_note:
        description: Failure-rule retry only - last 150 lines of the failing log
        required: false
        type: string
        default: ""
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: factory-lane-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  start:
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: force=true only from a person
        if: inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - name: Factory App configured?
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then echo "::error::PARKED: secrets FACTORY_APP_ID / FACTORY_APP_PRIVATE_KEY are not set (Factory App not created yet)."; exit 1; fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: integration
          sparse-checkout: |
            scripts/factory
            .github/factory
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Start the Cursor lane
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          FIX_NOTE: ${{ inputs.fix_note }}
          CURSOR_MODE: ${{ vars.FACTORY_CURSOR_MODE || 'automation' }}
          MODEL: ${{ vars.FACTORY_MODEL_CURSOR }}
          MODEL_PARAMS: ${{ vars.FACTORY_MODEL_CURSOR_PARAMS }}
        run: node scripts/factory/cursor-lane.mjs
