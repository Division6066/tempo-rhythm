# .github/workflows/agent-router.yml
#
# GitHub Issues are the tickets. This workflow is the dispatcher. No Linear, no Cyrus.
#
# TWO WAYS TO PUSH A TICKET:
#   1. Put a label on the issue:  agent:claude  |  agent:cursor  |  agent:codex
#   2. Or fire it by hand:  gh workflow run agent-router.yml -f agent=cursor -f issue=42
#
# 🔴 THE ONE FACT THIS WHOLE FILE IS BUILT ON:
#   Cursor DELIBERATELY IGNORES comments authored by bots, GITHUB_TOKEN included.
#   Cursor staff, forum.cursor.com/t/148135: "Comments from bots (including GitHub
#   Actions) may be intentionally filtered for security reasons." Their own fix:
#   post with a PAT so the comment comes from a real user.
#   claude-code-action rejects bot actors too. Assume Codex does the same.
#   => every @mention below is posted with DISPATCH_PAT, never GITHUB_TOKEN.
#
# SECRETS
#   DISPATCH_PAT               fine-grained PAT, issues:write on these repos. THE critical one.
#   CLAUDE_CODE_OAUTH_TOKEN    from `claude setup-token` -> runs bill to Claude Max, not API.

name: Agent Router

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: "Who takes it"
        required: true
        type: choice
        options: [claude, cursor, codex]
      issue:
        description: "Issue number"
        required: true
        type: string
      base:
        description: "Base branch"
        required: false
        default: integration
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.pick.outputs.agent }}
      issue: ${{ steps.pick.outputs.issue }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_BASE: ${{ inputs.base }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Label and workflow_dispatch both spend a write token. Triage and
          # read collaborators must not be able to start an agent.
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "agent=" >> "$GITHUB_OUTPUT"
              echo "issue=" >> "$GITHUB_OUTPUT"
              echo "Sender ${SENDER:-unknown} has permission $perm; agent router requires write."
              exit 0
              ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            AGENT="$INPUT_AGENT"
            ISSUE="$INPUT_ISSUE"
          else
            case "$LABEL_NAME" in
              agent:claude|agent:cursor|agent:codex) AGENT="${LABEL_NAME#agent:}" ;;
              *) echo "not an agent label, stopping"; exit 0 ;;
            esac
            ISSUE="$ISSUE_NUMBER"
          fi
          case "$AGENT" in
            claude|cursor|codex) ;;
            *) echo "::error::agent must be claude, cursor, or codex"; exit 1 ;;
          esac
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be digits"; exit 1 ;;
          esac
          BASE="${INPUT_BASE:-integration}"
          case "$BASE" in
            master|main|*/master|*/main)
              echo "::error::Agents branch from integration. master is yours."
              exit 1
              ;;
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*)
              echo "::error::base branch is not allowed"
              exit 1
              ;;
          esac
          # Values are charset-checked above, so a newline cannot inject another output.
          printf 'agent=%s\n' "$AGENT" >> "$GITHUB_OUTPUT"
          printf 'issue=%s\n' "$ISSUE" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"

  # ── CLAUDE: runs right here in Actions, on the Max subscription ──────────────
  claude:
    needs: route
    if: needs.route.outputs.agent == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.route.outputs.base }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install command wrappers and create the agent branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          # Wrappers live on integration. master does not have them until Amit
          # merges, and a workflow_dispatch base can rewrite the checkout scripts.
          TRUSTED_REF=integration
          case "$TRUSTED_REF" in
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*) echo "::error::trusted ref is not allowed"; exit 1 ;;
          esac
          git fetch --depth=1 origin "$TRUSTED_REF"
          git show "origin/${TRUSTED_REF}:.github/scripts/tempo-safe-git" > /usr/local/bin/tempo-safe-git
          git show "origin/${TRUSTED_REF}:.github/scripts/tempo-safe-bun" > /usr/local/bin/tempo-safe-bun
          chmod 0755 /usr/local/bin/tempo-safe-git /usr/local/bin/tempo-safe-bun
          BRANCH="claude/issue-${ISSUE}"
          git fetch --depth=1 origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -b "$BRANCH"
          fi
          # Write after checkout. An older branch can replace the tree, and
          # its .gitignore may not list this file.
          gh issue view "$ISSUE" --repo "$REPO" --comments > .tempo-issue.md
      - id: claude_code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ needs.route.outputs.base }}
          # No track_progress: tag mode prepends Bash(git add:*), Bash(git commit:*),
          # Bash(git rm:*), and a git-push helper. Those prefixes are unioned with
          # claude_args, so the wrapper list would not replace them.
          additional_permissions: |
            actions: read
          prompt: |
            The issue text is in `.tempo-issue.md`. Read that file and implement the work it asks for.
            You are already on branch `claude/issue-${{ needs.route.outputs.issue }}`, created from `${{ needs.route.outputs.base }}`.
            Do not push and do not open a pull request. A later step pushes this branch and opens the draft.
            Stay inside the file scope the issue declares. If the work needs a file outside that scope,
            stop and explain it in the pull request instead of widening scope. Never touch master.
            Do not run lint, test, or typecheck. CI runs those on the pull request.
            To commit, write `.tempo-commit-msg`, then run
            `/usr/local/bin/tempo-safe-git add` and `/usr/local/bin/tempo-safe-git commit`.
            Do not run `git`, `bun`, or `bunx` directly.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --setting-sources user
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(/usr/local/bin/tempo-safe-git status),Bash(/usr/local/bin/tempo-safe-git diff),Bash(/usr/local/bin/tempo-safe-git diff-cached),Bash(/usr/local/bin/tempo-safe-git log),Bash(/usr/local/bin/tempo-safe-git add),Bash(/usr/local/bin/tempo-safe-git commit)"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          BASE: ${{ needs.route.outputs.base }}
          ISSUE: ${{ needs.route.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          case "$BASE" in
            master|main|*/master|*/main|''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*)
              echo "::error::base branch is not allowed"
              exit 1
              ;;
          esac
          BRANCH="claude/issue-${ISSUE}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DISPATCH_PAT is empty; cannot open draft pull request"
            exit 1
          fi
          head=$(git rev-parse --abbrev-ref HEAD)
          ahead=$(git rev-list --count "${BASE}..HEAD" || echo 0)
          if [ "$head" != "$BRANCH" ] || [ "$ahead" = "0" ]; then
            echo "No commits on $BRANCH; not opening a pull request."
            exit 0
          fi
          if ! git push -u origin "$BRANCH"; then
            echo "::error::Push of $BRANCH failed. Refusing to force-push."
            exit 1
          fi
          EXISTING_PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE" --state open --json url --jq 'if length == 0 then "" else .[0].url // "" end')"
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Existing pull request: $EXISTING_PR"
            exit 0
          fi
          BODY="Automated Claude implementation for issue #$ISSUE.

          Please review before marking ready.

          Closes #$ISSUE"
          gh pr create \
            --repo "$REPO" \
            --head "$BRANCH" \
            --base "$BASE" \
            --draft \
            --title "fix: implement issue #$ISSUE" \
            --body "$BODY"

  # ── CURSOR + CODEX: mention them, as a real user, so their own app picks it up ──
  mention:
    needs: route
    if: needs.route.outputs.agent == 'cursor' || needs.route.outputs.agent == 'codex'
    runs-on: ubuntu-latest
    steps:
      - name: Hand the ticket over
        env:
          # NOT GITHUB_TOKEN. A bot-authored comment gets filtered and nothing happens.
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          AGENT: ${{ needs.route.outputs.agent }}
          ISSUE: ${{ needs.route.outputs.issue }}
          BASE: ${{ needs.route.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "@$AGENT Please implement this issue.

          Branch from \`$BASE\` and open a pull request back into \`$BASE\`. Stay inside the file scope
          this issue declares — if the work needs a file outside it, say so in the PR instead of widening
          the scope. Do not touch \`master\`."

      - name: Mark it dispatched
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          AGENT: ${{ needs.route.outputs.agent }}
          ISSUE: ${{ needs.route.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" \
            --add-label "dispatched:${AGENT}" || true
