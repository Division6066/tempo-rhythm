name: factory-merge

# Phase 04 Step 7. The merge agent: scripts/factory/merge-train.mjs (read its header).
# Every 15 min (normal mode) + manual (mode normal|stress, batch, dry_run). Factory App token for
# every write (update branch, label, merge, delete branch); merges with it start the push workflows
# on integration. Factory PRs are found by the `factory` label. Data PR first per batch.
# normal mode never merges hold:stress-test PRs. stress mode = rung 3 only, one PR at a time.
# PARKED until the Factory App exists (dry_run works without it: read-only, github.token).

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: normal or stress (stress = rung 3 only)
        type: choice
        options: [normal, stress]
        default: normal
      batch:
        description: Only this batch id (optional)
        type: string
        default: ""
      dry_run:
        description: Print the plan; change nothing
        type: boolean
        default: false
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read

concurrency:
  group: factory-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  train:
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: force=true only from a person
        if: github.event_name == 'workflow_dispatch' && inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - name: Factory App configured?
        id: app
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ -n "$APP_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY" = "true" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Factory App missing; dry run uses the read-only github.token."
          else echo "::error::PARKED: secrets FACTORY_APP_ID / FACTORY_APP_PRIVATE_KEY are not set (Factory App not created yet)."; exit 1; fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        if: steps.app.outputs.ok == 'true'
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: integration
          sparse-checkout: |
            scripts/factory
            .github/factory
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Merge train
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          MODE: ${{ inputs.mode || 'normal' }}
          BATCH: ${{ inputs.batch }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/factory/merge-train.mjs --mode "$MODE" ${BATCH:+--batch "$BATCH"} $DRY
