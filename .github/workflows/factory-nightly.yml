name: factory-nightly

# Phase 04 Step 9. Every night: the FULL Playwright E2E suite against the Vercel preview of
# integration's latest commit; screenshots/traces uploaded as evidence. A failure opens (or
# updates) ONE issue "Nightly E2E failing" assigned to Amit (github.token; an issue, not a PR).
# Cron is UTC: 00:30 UTC = 03:30 Israel summer time (UTC+3) / 02:30 winter (UTC+2).
# Also dispatched by the merge agent at the end of the stress run (rung 3).

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read
  statuses: read
  issues: write

concurrency:
  group: factory-nightly
  cancel-in-progress: false

jobs:
  e2e:
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: force=true only from a person
        if: github.event_name == 'workflow_dispatch' && inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - name: No preview configured
        if: vars.FACTORY_HAS_PREVIEW != 'true'
        run: echo "::warning::FACTORY_HAS_PREVIEW is not 'true'; no preview to test." && exit 1
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: integration
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Integration head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for the Vercel preview of integration's head
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PREVIEW_ENVIRONMENT: ${{ vars.FACTORY_PREVIEW_ENVIRONMENT }}
          PREVIEW_STATUS_CONTEXT: ${{ vars.FACTORY_PREVIEW_STATUS_CONTEXT }}
        run: node scripts/factory/wait-preview.mjs
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        if: steps.preview.outputs.url != ''
        with:
          bun-version: '1.3.9'
      - name: Install dependencies and Chromium
        if: steps.preview.outputs.url != ''
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Full Playwright E2E against the preview
        id: e2e
        if: steps.preview.outputs.url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: 'true'
        run: bunx playwright test --reporter=list,html
      - name: Upload screenshots, traces and report
        if: always() && steps.preview.outputs.url != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Open or update "Nightly E2E failing"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly E2E failing"' --json number -q '.[0].number')
          msg="Nightly E2E failed on integration ${SHA:0:7}: $RUN_URL (evidence artifact: nightly-e2e-evidence)"
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" -b "$msg"
          else gh issue create -R "$GITHUB_REPOSITORY" -t "Nightly E2E failing" -a Division6066 -b "$msg"; fi
