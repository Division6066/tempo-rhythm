name: factory-failures

# Phase 04 Step 8 (R16). On a FAILED run of CI (job `ci`) or e2e-preview, for PRs labelled
# `factory`: waiting:data / merge-fix (misalignment, max 2) / back to the lane (attempt:1-3) /
# blocked:amit (+ paused:dependency, + FACTORY_PAUSED=true and an issue for data tickets or 3+
# dependents). Script: scripts/factory/failures.mjs (read its header). One concurrency group per PR.
# PARKED until the Factory App exists (labels, dispatches and the pause variable use its token).

on:
  workflow_run:
    workflows: [CI, e2e-preview]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed workflow run id to handle
        required: true
        type: string
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: factory-failures-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  failure-rule:
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: force=true only from a person
        if: github.event_name == 'workflow_dispatch' && inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - name: Only failures
        id: f
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$CONCLUSION" = "failure" ] && [ "$EVENT" = "pull_request" ]; }; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Run concluded $CONCLUSION ($EVENT): nothing to do."; fi
      - name: Factory App configured?
        if: steps.f.outputs.go == 'true'
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then echo "::error::PARKED: secrets FACTORY_APP_ID / FACTORY_APP_PRIVATE_KEY are not set (Factory App not created yet)."; exit 1; fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        if: steps.f.outputs.go == 'true'
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: steps.f.outputs.go == 'true'
        with:
          ref: integration
          sparse-checkout: |
            scripts/factory
            .github/factory
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.f.outputs.go == 'true'
        with:
          node-version: 22
      - name: Failure rule
        if: steps.f.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: node scripts/factory/failures.mjs
