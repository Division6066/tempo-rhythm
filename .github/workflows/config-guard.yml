name: config-guard

# Goal E11: no automation can weaken a check.
# Fails when a PR changes CI, review, secret-scan, Playwright, scan or
# test-threshold config, unless the PR carries the `config-lane` label added by
# an allowed actor, and no one else pushed after that label was added.
#
# Uses pull_request_target so the guard logic comes from the default branch.
# This repo's default branch is `integration` (checked 2 Oct 2026), so the
# guard runs on every PR into integration and a PR cannot rewrite the guard
# that judges it. It never checks out or runs PR code; it only reads the API.
# Changing this file is itself guarded (.github/**).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  config-guard:
    name: config-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check guarded files and config-lane label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Who may apply `config-lane`. Division6066 is Amit; the orchestrator's
            // gh token and Composio connector writes also appear as Division6066.
            const ALLOWED = ['Division6066'];
            const LABEL = 'config-lane';
            const GUARDED = [
              /^\.github\//,
              /(^|\/)greptile\.json$/,
              /(^|\/)\.gitleaks[^/]*$/,
              /(^|\/)\.trufflehog[^/]*$/,
              /(^|\/)playwright\.config\.[^/]+$/,
              /(^|\/)(vitest|jest)\.(config|workspace)\.[^/]+$/,
              /(^|\/)\.(nycrc|c8rc)[^/]*$/,
              /(^|\/)codecov\.ya?ml$/,
              /(^|\/)bunfig\.toml$/,
              /^scripts\/ci\//,
              /^scripts\/(scan-|check-notices|secret-scan)[^/]*$/,
              /(^|\/)scan-baselines[^/]*$/,
            ];
            // package.json keys that define what CI runs or its thresholds.
            const PKG_KEYS = ['scripts', 'jest', 'c8', 'nyc', 'vitest', 'playwright'];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const problems = [];

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            if (files.length >= 3000 || files.length < pr.changed_files) {
              problems.push(`Could not read the full list of changed files (${files.length} of ${pr.changed_files}). Failing closed.`);
            }
            const paths = [...new Set(files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)))];
            const touched = paths.filter(p => GUARDED.some(r => r.test(p)));

            const readPkg = async (path, ref) => {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {
                return e.status === 404 ? {} : null;
              }
            };
            const PKG = /(^|\/)package\.json$/;
            for (const f of files.filter(f => PKG.test(f.filename) || PKG.test(f.previous_filename || ''))) {
              if (f.status !== 'modified' && f.status !== 'added' && f.status !== 'changed' || !PKG.test(f.filename)) {
                // Renaming, copying or removing a manifest can drop its scripts: always guarded.
                touched.push(`${f.previous_filename || f.filename} (package.json ${f.status})`);
                continue;
              }
              const before = await readPkg(f.filename, pr.base.sha);
              const after = await readPkg(f.filename, pr.head.sha);
              const changed = before === null || after === null ||
                PKG_KEYS.some(k => JSON.stringify(before[k] ?? null) !== JSON.stringify(after[k] ?? null));
              if (changed) touched.push(`${f.filename} (CI scripts/test config keys)`);
            }

            const hasLabel = pr.labels.some(l => l.name === LABEL);
            let labelEvt = null;
            if (hasLabel) {
              const tl = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: number, per_page: 100 });
              const evts = tl.filter(e => e.event === 'labeled' && e.label && e.label.name === LABEL);
              labelEvt = evts[evts.length - 1] || null;
              const who = labelEvt && labelEvt.actor ? labelEvt.actor.login : null;
              if (!who) problems.push(`Could not find who added "${LABEL}".`);
              else if (!ALLOWED.includes(who)) problems.push(`"${LABEL}" was added by ${who}, who is not allowed. Allowed: ${ALLOWED.join(', ')}.`);
            }

            if (touched.length && !hasLabel) {
              problems.push(`This PR changes guarded files but has no "${LABEL}" label.`);
            }

            // The label approves the code as it was when it was added. Any push (or
            // re-push of an older commit) to this PR by someone not allowed after that
            // time means an allowed actor must re-add the label.
            if (touched.length && labelEvt && labelEvt.actor && ALLOWED.includes(labelEvt.actor.login)) {
              const labelAt = new Date(labelEvt.created_at);
              const nBefore = problems.length;
              const sender = context.payload.sender.login;
              // A synchronize run is started by the push itself: the sender is the pusher
              // and the payload's updated_at is the server time of that push (not run start).
              if (context.payload.action === 'synchronize' && !ALLOWED.includes(sender) &&
                  new Date(context.payload.pull_request.updated_at) >= labelAt) {
                problems.push(`${sender} pushed after "${LABEL}" was added.`);
              }
              // Every push / PR event on this head commit and branch starts CI runs, with a
              // server-recorded created_at and actor = who pushed, opened or reopened.
              // Re-runs keep the original actor and time.
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, per_page: 100 });
              const mine = runs.filter(r => ['pull_request', 'push'].includes(r.event) &&
                r.head_branch === pr.head.ref &&
                r.head_repository && r.head_repository.full_name === pr.head.repo.full_name);
              if (!mine.length) {
                problems.push('No CI run found for the head commit yet, so its push time is unknown. Failing closed; re-run config-guard after CI starts.');
              }
              const late = mine.filter(r => new Date(r.created_at) >= labelAt && !ALLOWED.includes((r.actor || {}).login));
              if (late.length) {
                problems.push(`Push/PR activity on the head commit by ${[...new Set(late.map(r => r.actor.login))].join(', ')} after "${LABEL}" was added.`);
              }
              if (problems.length > nBefore) problems.push(`An allowed actor must remove and re-add "${LABEL}".`);
            }

            const lines = [
              `Guarded files changed: ${touched.length ? touched.join(', ') : 'none'}`,
              `"${LABEL}" label: ${hasLabel ? `yes (added by ${labelEvt && labelEvt.actor ? labelEvt.actor.login : 'unknown'})` : 'no'}`,
            ];
            await core.summary.addHeading('config-guard').addList(lines.concat(problems.map(p => `FAIL: ${p}`))).write();
            lines.forEach(l => core.info(l));
            if (problems.length) core.setFailed(problems.join('\n'));
            else core.info('config-guard passed.');
