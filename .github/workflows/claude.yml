# .github/workflows/claude.yml
# Interactive lane: someone writes "@claude ..." on an issue or PR.
# Auth: CLAUDE_CODE_OAUTH_TOKEN  -> runs bill to the Claude subscription, not API.
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo Division6066/tempo-rhythm
#   (generate with `claude setup-token` on pc2025; token lives in Bitwarden)
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write      # required for the action's default GitHub App auth
      actions: read        # lets Claude read CI results on the PR

    steps:
      - name: Require write access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "Sender ${SENDER:-unknown} has permission $perm; @claude requires write."
              ;;
          esac

      - uses: actions/checkout@v6
        if: steps.gate.outputs.allowed == 'true'
        with:
          fetch-depth: 1

      # --- the repo uses Bun 1.3.9, with Node 24 for the action runtime ---
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.allowed == 'true'
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.allowed == 'true'
        with:
          bun-version: 1.3.9
      - if: steps.gate.outputs.allowed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install command wrappers from integration
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          # pull_request_review_comment checks out the PR merge commit. A fork
          # can replace .github/scripts. Install the blobs from integration,
          # where this lane's workflows land. master does not have them yet.
          TRUSTED_REF=integration
          case "$TRUSTED_REF" in
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*) echo "::error::trusted ref is not allowed"; exit 1 ;;
          esac
          git fetch --depth=1 origin "$TRUSTED_REF"
          git show "origin/${TRUSTED_REF}:.github/scripts/tempo-safe-git" > /usr/local/bin/tempo-safe-git
          git show "origin/${TRUSTED_REF}:.github/scripts/tempo-safe-bun" > /usr/local/bin/tempo-safe-bun
          chmod 0755 /usr/local/bin/tempo-safe-git /usr/local/bin/tempo-safe-bun
      - name: Save the request for Claude
        if: steps.gate.outputs.allowed == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ -n "${COMMENT_BODY:-}" ]; then
            printf '%s\n' "$COMMENT_BODY" > .tempo-request.md
          else
            printf '%s\n' "${ISSUE_BODY:-}" > .tempo-request.md
          fi
      # ----------------------------------------------------------------------

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.allowed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # THE TRAP: the action rejects bot actors outright. If Zo / Hermes / Linear
          # ever comments "@claude" as an app, uncomment and name that bot login,
          # otherwise the run is refused with no useful error.
          # allowed_bots: "linear[bot],zo-agent[bot]"
          # Exact wrapper commands only. A trailing :* still matches --force, --delete,
          # HEAD:integration, and commit -F. The wrappers refuse extra arguments.
          # Do not open a pull request from the model; the action's own GitHub token
          # still comments. A write collaborator is required before this step runs.
          prompt: |
            The request is in `.tempo-request.md`. Read that file and do what it asks.
            Use only `/usr/local/bin/tempo-safe-git`.
            Do not run `git`, `bun`, or `bunx` directly.
            Do not run lint, test, or typecheck. CI runs those on the pull request.
            To name a branch, write one line starting with `claude/` to `.tempo-branch-name`,
            then run `/usr/local/bin/tempo-safe-git branch-new`.
            To commit, write `.tempo-commit-msg`, then run `add` and `commit` on that wrapper.
            To publish, run `/usr/local/bin/tempo-safe-git push` with no extra arguments.
            Never push `master`, `main`, or `integration`.
          claude_args: |
            --max-turns 25
            --model claude-sonnet-5
            --setting-sources user
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(/usr/local/bin/tempo-safe-git status),Bash(/usr/local/bin/tempo-safe-git diff),Bash(/usr/local/bin/tempo-safe-git diff-cached),Bash(/usr/local/bin/tempo-safe-git log),Bash(/usr/local/bin/tempo-safe-git add),Bash(/usr/local/bin/tempo-safe-git commit),Bash(/usr/local/bin/tempo-safe-git branch-new),Bash(/usr/local/bin/tempo-safe-git push)"
